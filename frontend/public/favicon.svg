<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ethioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b64da" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0066eb" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00a8ff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0c1e33" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#ethioGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Circuit Grid Tracks -->
  <path d="M12 20 L24 20 L30 14 M40 14 L46 20 L52 20 M12 44 L22 44 L28 50 M42 50 L48 44 L52 44" 
        stroke="#1e3a5f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="12" cy="20" r="2" fill="#00d2ff" />
  <circle cx="52" cy="20" r="2" fill="#00d2ff" />
  <circle cx="12" cy="44" r="2" fill="#00d2ff" />
  <circle cx="52" cy="44" r="2" fill="#00d2ff" />

  <!-- Central Tech Marketplace Icon (Geometric shopping cube + circuit core) -->
  <g filter="url(#glow)">
    <!-- Main Diamond/Cube Body -->
    <path d="M32 12 L49 22 L49 42 L32 52 L15 42 L15 22 Z" fill="url(#ethioGrad)" />
    <!-- Top Face Highlight -->
    <path d="M32 12 L49 22 L32 32 L15 22 Z" fill="#ffffff" fill-opacity="0.22" />
    <!-- Right Shaded Face -->
    <path d="M32 32 L49 22 L49 42 L32 52 Z" fill="#000000" fill-opacity="0.18" />
    <!-- Shopping Basket Handle Cutout / Tech Notch -->
    <path d="M26 22 C26 18.5 28.5 16 32 16 C35.5 16 38 18.5 38 22" 
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Golden Energy Core (Ethiopian Tech Accent) -->
    <circle cx="32" cy="34" r="5" fill="url(#goldAccent)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Connection Rays -->
    <line x1="32" y1="29" x2="32" y2="25" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="37" x2="24" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="37" x2="40" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>